<html lang="fr" data-theme="dark"><head><meta charset="utf-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover"/>

<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

<style>
/* CAGE LEGACY — thème sombre + clair (registre d'archives, lisible mobile) */
:root{
 --bg:#110E0A; --panel:#110E0A; --panel2:#1C1711; --line:#3C3122;
 --text:#E8E1D1; --muted:#8F826D; --faint:#776B58;
 --blood:#C7332A; --blood-d:#8A2621; --gold:#D4AF37; --gold-d:#6B541A;
 --sage:#6E8478; --win:#86A87F; --loss:#C7332A;
 --r:0px; --maxw:560px;
}
[data-theme="light"]{
 --bg:#EFE9DC; --panel:#FBF7EE; --panel2:#F3ECDB; --line:#D9CEB8;
 --text:#241C12; --muted:#6E6250; --faint:#A99B84;
 --blood:#A5322D; --blood-d:#8A2621; --gold:#9A7B2E; --gold-d:#CBB27A;
 --sage:#4F6B5E; --win:#3F7A46; --loss:#A5322D;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;padding:0;background:var(--bg)}
body{color:var(--text);font-family:'Fraunces',Georgia,serif;font-size:16px;line-height:1.45;-webkit-font-smoothing:antialiased;
 background-image:radial-gradient(rgba(0,0,0,.14) 1px,transparent 1px);background-size:4px 4px;transition:background .2s,color .2s}
[data-theme="light"] body{background-image:radial-gradient(rgba(120,100,60,.08) 1px,transparent 1px)}
#app{max-width:var(--maxw);margin:0 auto}
.scr{padding:16px 15px 40px;animation:fade .22s ease}
@keyframes fade{from{opacity:0;transform:translateY(4px)}to{opacity:1;transform:none}}
@media(prefers-reduced-motion:reduce){.scr{animation:none}}
.disp{font-family:'Oswald',sans-serif;font-weight:600;text-transform:uppercase;letter-spacing:.02em;line-height:1;margin:0}
.disp.big{font-size:clamp(40px,13vw,58px);font-weight:700}
.mono{font-family:'JetBrains Mono',monospace}
.eyebrow{font-family:'JetBrains Mono',monospace;font-size:11px;letter-spacing:.2em;text-transform:uppercase;color:var(--muted)}
.lede{color:var(--muted);font-size:15px;max-width:400px;margin:10px auto 20px}
.lede.small{font-size:13.5px;margin:6px 0 16px}
h2.disp{font-size:24px;margin-bottom:12px}
.center{text-align:center}.muted{color:var(--muted)}.gold{color:var(--gold)}.loss{color:var(--loss)}.small{font-size:13px}.mb{margin-bottom:8px}.mt{margin-top:10px}
.intro{padding-top:12vh;position:relative}
.theme-btn{position:absolute;top:14px;right:8px;font-size:22px;cursor:pointer;padding:6px}
.card{background:transparent;border:none;border-top:2px solid var(--line);border-bottom:2px solid var(--line);border-radius:0;padding:16px 0;margin:-1px 0}
.card.gold-b{border-color:var(--gold);background:transparent}
.hr{height:1px;background:var(--line);border:0;margin:11px 0}
.tag{display:inline-block;font-family:'JetBrains Mono',monospace;font-size:11px;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);border:1px solid var(--muted);border-radius:0;padding:4px 10px;font-weight:bold}
.tag.gold{color:var(--gold);border-color:var(--gold-d)}
.tag.blood{color:var(--loss);border-color:var(--blood-d)}
button{font-family:'Oswald',sans-serif;cursor:pointer;border:0;border-radius:0;font-size:16px;letter-spacing:.05em}
.btn{display:block;width:100%;text-align:center;background:transparent;color:var(--text);border:1px solid var(--line);padding:14px;margin:9px 0;text-transform:uppercase;font-weight:500;transition:all .1s}
.btn:hover,.btn:active{background:var(--text);color:var(--bg)}
.btn.primary{background:var(--blood);color:#fff;border-color:var(--blood)}
.btn.primary:hover{background:#fff;color:var(--blood);border-color:#fff}
.btn.gold{background:var(--gold);color:#241c12;border-color:var(--gold)}
.btn.ghost{background:transparent;color:var(--muted);font-size:13px;letter-spacing:.12em;padding:11px}
.g2{display:flex;gap:9px}.g2>*{flex:1;margin:9px 0}
.bar{display:flex;justify-content:space-between;align-items:center;margin-bottom:10px}
.bar .x{cursor:pointer;font-size:15px}
.fld{margin:12px 0}.fld label{display:block;font-family:'JetBrains Mono',monospace;font-size:11px;letter-spacing:.12em;text-transform:uppercase;color:var(--muted);margin-bottom:7px}
.fld input{width:100%;background:var(--panel2);border:1px solid var(--line);color:var(--text);padding:12px;border-radius:var(--r);font-family:'Fraunces',serif;font-size:16px}
.pills{display:flex;flex-wrap:wrap;gap:7px}
.pill{font-family:'Oswald',sans-serif;text-transform:uppercase;font-size:13px;letter-spacing:.02em;padding:9px 13px;border:1px solid var(--line);border-radius:0;background:var(--panel2);color:var(--muted)}
.pill.on{background:var(--blood);color:#fff;border-color:var(--blood-d)}
.note{color:var(--muted);border-left:2px solid var(--gold-d);padding-left:10px;margin:12px 0}
/* fiche */
.fh{display:flex;justify-content:space-between;align-items:flex-start;gap:10px}
.fh .nm{font-family:'Oswald',sans-serif;font-weight:700;text-transform:uppercase;font-size:clamp(24px,7vw,34px);line-height:.98}
.fh .nick{color:var(--gold);font-style:italic;font-size:15px;margin-top:2px}
.fh .sub{color:var(--muted);font-family:'JetBrains Mono',monospace;font-size:11.5px;letter-spacing:.03em;margin-top:6px}
.fh .fl{font-size:28px}
.rec{font-family:'JetBrains Mono',monospace;font-size:22px;margin:10px 0 8px}
.l5{display:flex;gap:6px;margin:8px 0}
.l5 .p{flex:1;text-align:center;border:1px solid var(--line);border-radius:5px;padding:5px 0;font-family:'Oswald';font-weight:700;font-size:15px}
.l5 .p i{display:block;font-style:normal;font-size:8.5px;font-family:'JetBrains Mono';letter-spacing:.05em;font-weight:400;margin-top:1px;color:var(--faint)}
.l5 .p.w{color:var(--win);border-color:var(--gold-d)}.l5 .p.l{color:var(--loss);border-color:var(--blood-d)}
.mf{display:flex;gap:14px;margin-top:10px}.mf>div{flex:1}
.mf-l{display:block;font-family:'JetBrains Mono';font-size:10px;letter-spacing:.1em;text-transform:uppercase;color:var(--muted);margin-bottom:4px}
.gauge{display:inline-block;width:100%;height:4px;background:var(--line);border:none;border-radius:0;overflow:hidden;vertical-align:middle}
.gauge>span{display:block;height:100%;background:var(--text)}
/* adversaires / camp */
.opp{background:var(--panel2);border:1px solid var(--line);border-radius:0;padding:13px;margin:10px 0;cursor:pointer;transition:border-color .12s,transform .05s}
.opp:active{transform:translateY(1px)}.opp:hover{border-color:var(--gold-d)}
.opp-top{display:flex;justify-content:space-between;align-items:baseline}
.opp-nm{font-family:'Oswald';text-transform:uppercase;font-weight:600;font-size:18px}
.opp-rec{font-family:'JetBrains Mono';color:var(--muted);font-size:13px}
.opp-mid{color:var(--muted);font-size:13px;margin:3px 0 8px}
.opp-wp{display:flex;align-items:center;gap:8px;margin:6px 0}
.opp-wp-l{font-family:'JetBrains Mono';font-size:9.5px;letter-spacing:.1em;text-transform:uppercase;color:var(--muted);flex:0 0 auto}
.opp-wp .gauge{flex:1}
.opp-wp-v{font-family:'JetBrains Mono';font-size:13px;color:var(--gold);flex:0 0 auto}
.opp-read{font-style:italic;color:var(--text);font-size:13.5px;margin-top:6px;opacity:.85}
.dlts{display:flex;flex-wrap:wrap;gap:6px;margin-top:8px}
.dlt{font-family:'JetBrains Mono';font-size:11.5px;padding:3px 8px;border-radius:4px;border:1px solid var(--line)}
.dlt.up{color:var(--win);border-color:var(--gold-d)}.dlt.dn{color:var(--loss);border-color:var(--blood-d)}
/* résultat */
.stats-card .st-row{display:grid;grid-template-columns:1fr auto 1fr;align-items:center;padding:5px 0;border-bottom:1px dotted var(--line);font-family:'JetBrains Mono';font-size:15px}
.st-row .st-l{color:var(--muted);font-size:10.5px;letter-spacing:.08em;text-transform:uppercase;padding:0 12px}
.st-row span:first-child{text-align:right;color:var(--blood)}.st-row span:last-child{text-align:left;color:var(--sage)}
.skill-unlock{font-size:14.5px}
.ach{display:flex;gap:10px;align-items:center;padding:8px 0;border-bottom:1px solid var(--line)}
.ach .ico{font-size:19px}.ach.lk{opacity:.32}
/* profil */
.grp-h{display:flex;justify-content:space-between;align-items:baseline;margin-bottom:9px}
.attr{display:flex;align-items:center;gap:9px;margin:5px 0}
.attr-l{flex:0 0 120px;font-family:'JetBrains Mono';font-size:11.5px;color:var(--muted)}
.attr .gauge{flex:1}.attr-v{flex:0 0 26px;text-align:right;font-family:'JetBrains Mono';font-size:13px}
.story{font-size:13.5px;color:var(--text);margin-top:7px;opacity:.9}.story b{color:var(--gold);font-weight:600}
/* classement */
.rk{display:flex;align-items:center;gap:10px;padding:8px 4px;border-bottom:1px solid var(--line);font-family:'JetBrains Mono';font-size:13px}
.rk-p{flex:0 0 24px;text-align:right;color:var(--muted)}.rk-n{flex:1;font-family:'Fraunces';font-size:15px}.rk-r{color:var(--muted)}
.rk.you{background:var(--blood-d);border-radius:6px;padding-left:8px}.rk.ch .rk-n{color:var(--gold)}
/* legacy */
.epis{display:flex;flex-wrap:wrap;gap:7px;justify-content:center}
.epi{font-family:'Oswald';text-transform:uppercase;font-size:12px;letter-spacing:.03em;color:var(--gold);border:1px solid var(--gold-d);border-radius:20px;padding:5px 12px}
.lg{display:flex;gap:8px;text-align:center;margin-top:4px}.lg>div{flex:1}
.lg-v{display:block;font-family:'JetBrains Mono';font-size:18px}.lg-l{font-family:'JetBrains Mono';font-size:9px;letter-spacing:.08em;text-transform:uppercase;color:var(--muted)}
/* arène (barres) */
.arena-hud{display:flex;justify-content:space-between;font-family:'Oswald';text-transform:uppercase;font-size:14px}
.arena-bars{display:flex;gap:8px;margin-top:5px}.arena-bars.sm{margin-top:3px}
.arena-bars .ab{flex:1;height:9px;background:var(--panel2);border:1px solid var(--line);border-radius:3px;overflow:hidden;position:relative}
.arena-bars.sm .ab{height:5px}
.ab-fill{position:absolute;top:0;bottom:0;left:0;width:100%;transition:width .16s linear}
.ab-fill.me{background:linear-gradient(90deg,var(--blood-d),var(--blood))}
.ab-fill.op{left:auto;right:0;background:linear-gradient(270deg,var(--sage),#8fa89b)}
.ab-fill.st{background:var(--gold);opacity:.6}
.arena-st{display:flex;justify-content:space-between;margin-top:7px}
.arena-st .st-lbl{font-family:'JetBrains Mono';font-size:9px;letter-spacing:.1em;text-transform:uppercase;color:var(--faint);flex:1}
.arena-st .st-lbl:last-child{text-align:right}
:focus-visible{outline:2px solid var(--gold);outline-offset:2px}
.fight-log{display:flex;flex-direction:column;gap:0}
.log-row{display:flex;gap:10px;padding:5px 0;border-bottom:1px dotted var(--line);font-family:'JetBrains Mono',monospace;font-size:12.5px}
.log-row.gold{color:var(--gold)}
.log-r{flex:0 0 28px;color:var(--muted)}
</style></head>
<body><div id="app"></div>
<script>
(function(){
"use strict";
/* =========================================================================
   CAGE LEGACY — MOTEUR v2 (reconstruction)
   30 attributs (Technique/Mental/Physique) internes /100, AFFICHÉS /20.
   Génération profonde (origine + motivation + potentiel caché). Combat qui
   produit de vraies statistiques de round + log lisible. Échelle d'orgs.
   Classement/GOAT corrigés (les défaites pèsent lourd). Pas d'argent.
   Cadre de compétences uniques. Aucune dépendance externe (Node pur).
   ========================================================================= */
"use strict";
let SEED=(Date.now()^0x9e3779b9)>>>0;
function setSeed(s){ SEED=(s>>>0)||1; }
function rnd(){ SEED=(SEED*1664525+1013904223)>>>0; return SEED/4294967296; }
const RI=(a,b)=>Math.floor(rnd()*(b-a+1))+a;
const R=(a,b)=>a+rnd()*(b-a);
const pick=a=>a[Math.floor(rnd()*a.length)];
const clamp=(v,lo=1,hi=100)=>v<lo?lo:v>hi?hi:v;
function gauss(m,sd,lo,hi){ let u=0,v=0; while(!u)u=rnd(); while(!v)v=rnd(); let g=Math.sqrt(-2*Math.log(u))*Math.cos(2*Math.PI*v); let x=Math.round(m+g*sd); if(lo!=null)x=Math.max(lo,x); if(hi!=null)x=Math.min(hi,x); return x; }
const sigmoid=x=>1/(1+Math.exp(-x));
const d20=v=>Math.max(1,Math.min(20,Math.round(v/5)));   // /100 -> /20 affiché

/* --------------------------- 30 ATTRIBUTS --------------------------------- */
const ATTR={
  tech:[['jab','Jab'],['cross','Direct'],['hook','Crochets'],['kick','Coups de pied'],['clinchStr','Lutte debout'],
        ['takedown','Amenées au sol'],['tdd','Défense lutte'],['topControl','Contrôle au sol'],['gnp','Sol offensif'],
        ['submission','Soumissions'],['guardWork','Jeu de garde']],
  ment:[['fightIQ','Intelligence'],['composure','Sang-froid'],['aggression','Agressivité'],['heart','Cœur'],
        ['discipline','Discipline'],['adaptability','Adaptation'],['killer','Instinct de finition'],['focus','Concentration'],['confidence','Confiance']],
  phys:[['power','Puissance'],['handSpeed','Vitesse des mains'],['footSpeed','Jeu de jambes'],['cardio','Cardio'],
        ['strength','Force'],['chin','Menton'],['recovery','Récupération'],['explosiveness','Explosivité'],['flexibility','Souplesse'],['durability','Résistance']],
};
const ALL_ATTR=[].concat(ATTR.tech,ATTR.ment,ATTR.phys);
const ATTR_KEYS=ALL_ATTR.map(a=>a[0]);
const CHIN='chin';                                  // ne monte jamais
const TRAINABLE=ATTR_KEYS.filter(k=>k!==CHIN);
const attrLabel=k=>(ALL_ATTR.find(a=>a[0]===k)||[k,k])[1];

/* ------------------------- DIVISIONS & STYLES ----------------------------- */
const DIVISIONS={
 H:[{id:'H-fly',name:'Poids mouche',h:168,r:170},{id:'H-bantam',name:'Poids coq',h:171,r:173},
    {id:'H-feather',name:'Poids plume',h:173,r:175},{id:'H-light',name:'Poids léger',h:175,r:178},
    {id:'H-welter',name:'Poids mi-moyen',h:180,r:184},{id:'H-middle',name:'Poids moyen',h:184,r:189},
    {id:'H-lheavy',name:'Poids mi-lourd',h:188,r:193},{id:'H-heavy',name:'Poids lourd',h:191,r:196}],
 F:[{id:'F-straw',name:'Poids paille',h:163,r:164},{id:'F-fly',name:'Poids mouche',h:165,r:166},
    {id:'F-bantam',name:'Poids coq',h:168,r:169},{id:'F-feather',name:'Poids plume',h:170,r:172}],
};
DIVISIONS.H.forEach(d=>d.gender='H'); DIVISIONS.F.forEach(d=>d.gender='F');
const allDivisions=()=>DIVISIONS.H.concat(DIVISIONS.F);
const divById=id=>allDivisions().find(d=>d.id===id);

/* biais de style : quels attributs sont naturellement plus hauts au départ */
const STYLES={
  boxer:{label:'Boxe',b:{jab:8,cross:9,hook:8,handSpeed:8,footSpeed:5,power:4,tdd:3},grap:0.15},
  kickboxer:{label:'Kickboxing',b:{kick:11,cross:8,clinchStr:7,footSpeed:6,power:5,tdd:4},grap:0.2},
  muayThai:{label:'Muay-thaï',b:{kick:11,clinchStr:11,hook:6,strength:5,durability:5,power:4,tdd:4},grap:0.3},
  karate:{label:'Karaté',b:{footSpeed:11,kick:8,jab:6,handSpeed:6,fightIQ:5,tdd:3},grap:0.15},
  wrestler:{label:'Lutte',b:{takedown:9,tdd:9,topControl:8,strength:7,cardio:5},grap:0.77},
  bjj:{label:'Jiu-jitsu',b:{submission:12,guardWork:10,gnp:7,flexibility:6,composure:5,tdd:4,takedown:4},grap:0.72},
  sambo:{label:'Sambo',b:{takedown:8,submission:9,topControl:7,strength:6,heart:5,tdd:4},grap:0.66},
  mma:{label:'MMA complet',b:{fightIQ:7,adaptability:7,cardio:7,tdd:8,cross:7,hook:5,takedown:4,kick:5},grap:0.5},
};
const STYLE_KEYS=Object.keys(STYLES);
const styleLabel=s=>(STYLES[s]||{label:s}).label;

/* ------------------------------ NOMS -------------------------------------- */
const COUNTRIES={
 FR:{name:'France',flag:'🇫🇷',last:['Moreau','Lefevre','Dubois','Girard','Faure','Roussel','Blanc','Mercier']},
 BR:{name:'Brésil',flag:'🇧🇷',last:['Silva','Souza','Oliveira','Costa','Almeida','Pereira','Lima','Rocha']},
 US:{name:'États-Unis',flag:'🇺🇸',last:['Johnson','Williams','Brown','Miller','Davis','Wilson','Carter','Reed']},
 DAG:{name:'Daghestan',flag:'🏔️',last:['Nurmagomedov','Aliev','Magomedov','Gadzhiev','Ramazanov','Shamilov','Umarov']},
 JP:{name:'Japon',flag:'🇯🇵',last:['Sato','Suzuki','Takahashi','Tanaka','Watanabe','Kobayashi','Nakamura']},
 NG:{name:'Nigéria',flag:'🇳🇬',last:['Adeyemi','Okafor','Balogun','Eze','Okoye','Abubakar','Nwosu']},

 RU:{name:'Russie',flag:'🇷🇺',last:['Volkov','Petrov','Sokolov','Ivanov','Popov','Kozlov','Orlov']},
 MX:{name:'Mexique',flag:'🇲🇽',last:['Hernández','García','Martínez','López','Ramírez','Torres','Flores']},
 IE:{name:'Irlande',flag:'🇮🇪',last:['Murphy','Kelly','OBrien','Byrne','Ryan','Walsh','McCarthy']},
 TH:{name:'Thaïlande',flag:'🇹🇭',last:['Sittichai','Petchyindee','Kiatmoo','Sor','Rungravee']},
 KR:{name:'Corée',flag:'🇰🇷',last:['Kim','Lee','Park','Choi','Jung','Kang','Yoon']},
 CM:{name:'Cameroun',flag:'🇨🇲',last:['Ngannou','Mbappe','Etoo','Nkemdirim','Fotso','Biya']},
 GE:{name:'Géorgie',flag:'🇬🇪',last:['Dvalishvili','Beridze','Kvaratskhelia','Chikadze','Gogitidze']},
};
const COUNTRY_KEYS=Object.keys(COUNTRIES);
const FIRST_M=['Alex','Marcus','Diego','Ivan','Kenji','Samuel','Leon','Rashid','Tariq','Bruno','Kai','Omar','Noah','Yuki','Malik','Hugo','Sean','Nikolai','Andre','Felix','Jamal','Ravi','Enzo','Kofi','Dante'];
const FIRST_F=['Amara','Lena','Sofia','Nadia','Yuki','Maya','Zara','Ana','Ines','Kira','Fatima','Nina','Rosa','Aiko','Elena','Sara','Leïla','Tara','Bianca','Hana'];
function makeName(gender,ck,firstOverride){ const c=COUNTRIES[ck]; const first=firstOverride||pick(gender==='F'?FIRST_F:FIRST_M); const last=pick(c.last); return {first,last,name:first+' '+last,flag:c.flag,countryKey:ck}; }

/* ----------------------- BACKSTORY & MOTIVATION --------------------------- */
const ORIGINS=[
 'a grandi dans un quartier où il fallait se battre pour exister',
 'découvre le sport tard, presque par accident, et ne l\u2019a plus jamais lâché',
 'vient d\u2019une famille de lutteurs, sur les tapis depuis l\u2019enfance',
 'était un gamin frêle qu\u2019on brimait, jusqu\u2019au jour où il a poussé la porte d\u2019un club',
 'a fui la guerre et trouvé dans la cage un terrain où les règles sont claires',
 'était promis à une carrière d\u2019athlète avant de tout plaquer pour le combat',
 'a appris à se battre dans la rue avant d\u2019apprendre à le faire proprement',
 'sort d\u2019une salle réputée qui a formé des champions avant lui',
];
const MOTIVATIONS=[
 {short:'Sortir sa famille de la misère',drive:'heart'},
 {short:'Prouver au monde qu\u2019on avait tort sur lui',drive:'aggression'},
 {short:'Laisser un nom que l\u2019Histoire retiendra',drive:'killer'},
 {short:'Honorer la mémoire d\u2019un proche disparu',drive:'discipline'},
 {short:'La rage froide de ne jamais être respecté',drive:'aggression'},
 {short:'L\u2019amour pur du combat, rien d\u2019autre',drive:'focus'},
 {short:'Racheter un passé qu\u2019il traîne comme un poids',drive:'composure'},
 {short:'Devenir le meilleur, sans concession',drive:'confidence'},
];

/* ------------------------- COMPÉTENCES (cadre) ---------------------------- */
/* Débloquables par chance au fil de la carrière. type: frappe/sol/mental/phys.
   effet: petit bonus sur des attributs OU sur la proba d'une finition. (~à étendre vers 100) */
const SKILLS=[
 {id:'superman',name:'Superman Punch',type:'frappe',rar:'rare',fx:{cross:4,killer:3},blurb:'Un direct sauté qui surgit de nulle part.'},
 {id:'spinback',name:'Spinning Back Fist',type:'frappe',rar:'rare',fx:{hook:4,handSpeed:3}},
 {id:'questionmark',name:'Question Mark Kick',type:'frappe',rar:'epic',fx:{kick:5,fightIQ:2}},
 {id:'calfkick',name:'Calf Kick',type:'frappe',rar:'commun',fx:{kick:3,footSpeed:2}},
 {id:'liverkick',name:'Coup de pied au foie',type:'frappe',rar:'rare',fx:{kick:4,killer:2}},

/* ------------------------- CRÉATION D'UN COMBATTANT ----------------------- */
let _id=1;
function makePhysical(div){ const D=div||pick(allDivisions());
  let height=gauss(D.h,4,D.h-9,D.h+11); let reach=Math.round(height+gauss(D.r-D.h,2.5)); if(reach<height-1)reach=height-1;
  const tags=[]; if(rnd()<0.02){reach+=RI(6,12);tags.push('allonge hors-norme');} if(rnd()<0.02)tags.push('densité rare (type Ngannou)'); if(rnd()<0.02)tags.push('explosivité rare (type Cormier)');
  return {height,reach,tags};
}
function baseAttrs(style,level,predis){ const o={}; const bias=(STYLES[style]||{b:{}}).b;
  for(const k of ATTR_KEYS){ let v=gauss(level, 9, 6, 96); if(bias[k])v=clamp(v+bias[k]); o[k]=v; }
  if(predis){ if(predis.includes('densité'))o.power=clamp(o.power+RI(8,16)); if(predis.includes('explosivité')){o.explosiveness=clamp(o.explosiveness+RI(8,14));o.takedown=clamp(o.takedown+RI(5,10));} }
  return o;
}
function makeFighter(opt={}){ const gender=opt.gender||pick(['H','F']);
  const div=divById(opt.div)|| (gender==='H'?pick(DIVISIONS.H):pick(DIVISIONS.F));
  const style=opt.style||pick(STYLE_KEYS); const ck=opt.countryKey||pick(COUNTRY_KEYS);
  const nm=makeName(gender,ck,opt.first);
  const phys=makePhysical(div);
  const level=opt.level!=null?opt.level:gauss(46,10,20,80);
  const attrs=baseAttrs(style,level,phys.tags.join(' '));
  const potential=opt.potential!=null?opt.potential:gauss(64,12,34,97);   // caché
  const dynamic=0;                                                         // moral/forme caché ±
  const mot=pick(MOTIVATIONS); const origin=pick(ORIGINS);
  const f={ id:_id++, gender, div:div.id, divName:div.name, style, styleLabel:styleLabel(style),
    first:nm.first,last:nm.last,name:nm.name,flag:nm.flag,countryKey:ck,
    phys, attrs, potential, dynamic, morale:60, form:55,
    stage:'amateur', org:0, orgWins:0, age:opt.age!=null?opt.age:RI(18,22),
    W:0,L:0,D:0,ko:0,sub:0,dec:0,koLoss:0,streak:0, champion:null, titles:0, defenses:0,
    skills:[], history:[], origin, motivation:mot.short, drive:mot.drive, amaRec:null, amaTitle:false, nick:null, epithets:[] };
  f.overall=overall(f);
  return f;
}

/* ------------------- canaux de combat dérivés des 30 attributs ------------ */
function eff(f){ const a=f.attrs; const dyn=(f.morale-50)*0.10+(f.form-50)*0.10; // moral/forme -> ±
  const ch={
    striking: a.jab*0.24+a.cross*0.24+a.hook*0.2+a.kick*0.18+a.clinchStr*0.14 + a.fightIQ*0.06,
    power:    a.power + a.strength*0.12,
    handSpeed:a.handSpeed*0.85 + a.footSpeed*0.15,
    footwork: a.footSpeed*0.8 + a.flexibility*0.2,
    clinch:   a.clinchStr*0.8 + a.strength*0.2,
    takedown: a.takedown*0.78 + a.strength*0.12 + a.explosiveness*0.08,
    tdd:      a.tdd*0.88 + a.strength*0.08 + a.flexibility*0.06 + 2,
    topControl:a.topControl*0.82 + a.strength*0.18,
    ground:   a.gnp*0.82 + a.power*0.18,
    submission:a.submission*0.9 + a.flexibility*0.1,
    guard:    a.guardWork*0.85 + a.flexibility*0.15,
    cardio:   a.cardio*0.82 + a.recovery*0.18,
    chin:     a.chin*0.72 + a.durability*0.28,
    fightIQ:  a.fightIQ*0.7 + a.composure*0.18 + a.adaptability*0.12,
    killer:   a.killer, heart:a.heart, aggression:a.aggression,
  };
  for(const k in ch){ if(k!=='chin'&&k!=='killer'&&k!=='heart'&&k!=='aggression') ch[k]=clamp(ch[k]+dyn,1,100); }
  // bonus de compétences débloquées
  for(const sid of f.skills){ const S=SKILLS.find(s=>s.id===sid); if(S&&S.fx){} }
  return ch;
}
function overall(f){ const a=f.attrs;
  // récompense la spécialisation : le coeur des meilleurs attributs pèse plus
  const vals=ATTR_KEYS.map(k=>a[k]).sort((x,y)=>y-x);
  const top=vals.slice(0,10), topAvg=top.reduce((s,v)=>s+v,0)/top.length;
  const allAvg=vals.reduce((s,v)=>s+v,0)/vals.length;
  let ov=topAvg*0.68+allAvg*0.32 + (f.dynamic||0)*0.3;
  return clamp(Math.round(ov),1,100);
}
function groupAvg(f){ const a=f.attrs; const g=k=>Math.round(k.reduce((s,x)=>s+a[x[0]],0)/k.length);
  return {tech:g(ATTR.tech),ment:g(ATTR.ment),phys:g(ATTR.phys)}; }

/* ------------------------------- COMBAT ----------------------------------- */
function reachEdge(A,B){ return clamp((A.phys.reach-B.phys.reach)*0.14,-6,6); }
function simulateFight(A,B,rounds=3){ const a=eff(A),b=eff(B);
  const giA=STYLES[A.style].grap, giB=STYLES[B.style].grap; const rEdge=reachEdge(A,B);
  let sa=0,sb=0,dmgA=0,dmgB=0,finish=null; const log=[];
  const st={ // statistiques de combat
    A:{sig:0,td:0,tdAtt:0,ctrl:0,sub:0,kd:0}, B:{sig:0,td:0,tdAtt:0,ctrl:0,sub:0,kd:0} };
  for(let r=1;r<=rounds && !finish;r++){
    const fatA=clamp((dmgA-a.cardio)*0.06,0,18), fatB=clamp((dmgB-b.cardio)*0.06,0,18);
    const attA=giA*(0.55+rnd()*0.45), attB=giB*(0.55+rnd()*0.45);
    if(attA>0.14)st.A.tdAtt++; if(attB>0.14)st.B.tdAtt++;
    const tdA=attA>0.14?sigmoid((a.takedown-b.tdd)/15)*attA:0;
    const tdB=attB>0.14?sigmoid((b.takedown-a.tdd)/15)*attB:0;
    let grounded=false,topIsA=false; const gTop=Math.max(tdA,tdB);
    if(gTop>0.18 && rnd()<clamp(gTop*0.96,0,0.82)){ grounded=true; topIsA=tdA>=tdB; if(topIsA)st.A.td++; else st.B.td++; }
    if(grounded){ const top=topIsA?a:b, bot=topIsA?b:a, topF=topIsA?A:B, botF=topIsA?B:A, topFat=topIsA?fatA:fatB;
      const control=clamp((top.topControl-bot.guard)*0.32,0,11);
      const gnp=clamp((top.ground*0.5+top.power*0.45)-bot.guard*0.55-topFat,0,45);
      const subTop=clamp(top.submission-bot.guard*0.85,0,45)*(1+top.killer*0.004);
      const subBot=clamp(bot.submission-top.topControl*0.7-top.ground*0.4,0,35);
      const topPts=6+control*0.5+gnp*0.46+subTop*0.22; const botPts=subBot*0.9+clamp(bot.guard-top.topControl,0,22)*0.16+3;
      if(topIsA){sa+=topPts;sb+=botPts;dmgB+=gnp*0.32;st.A.ctrl+=1;st.A.sig+=Math.round(gnp*0.4);} else {sb+=topPts;sa+=botPts;dmgA+=gnp*0.32;st.B.ctrl+=1;st.B.sig+=Math.round(gnp*0.4);}
      const heartR=1-(bot.heart*0.0016);
      const koGnp=clamp((top.power-bot.chin)/56,0,.72)*clamp(gnp/22,0,1)*0.62*(1-bot.fightIQ*0.0022)*heartR;
      const subChT=clamp((top.submission-bot.guard)/29,0,.84)*0.98*(1-bot.fightIQ*0.0022);
      const subChB=clamp((bot.submission-top.guard)/42,0,.7)*0.44*(1-top.fightIQ*0.0022);
      if(rnd()<subChT){finish={by:topF,loser:botF,method:'Soumission',round:r};(topIsA?st.A:st.B).sub++;}
      else if(rnd()<koGnp){finish={by:topF,loser:botF,method:'KO/TKO',round:r,detail:'coups au sol'};(topIsA?st.B:st.A).kd++;}
      else if(rnd()<subChB){finish={by:botF,loser:topF,method:'Soumission',round:r,detail:'par le bas'};(topIsA?st.B:st.A).sub++;}
      log.push({r,phase:'sol',top:topIsA?'A':'B'});
    } else {
      const offA=a.striking*0.72+a.power*0.35+a.handSpeed*0.22+a.footwork*0.14+a.clinch*0.14+rEdge-b.footwork*0.2-b.fightIQ*0.14-fatA;
      const offB=b.striking*0.72+b.power*0.35+b.handSpeed*0.22+b.footwork*0.14+b.clinch*0.14-rEdge-a.footwork*0.2-a.fightIQ*0.14-fatB;
      const pA=clamp(offA*0.55,0,70)+RI(-7,7), pB=clamp(offB*0.55,0,70)+RI(-7,7);
      sa+=pA;sb+=pB;dmgA+=clamp(offB*0.22,0,22);dmgB+=clamp(offA*0.22,0,22);
      st.A.sig+=clamp(Math.round(pA*0.5),0,40); st.B.sig+=clamp(Math.round(pB*0.5),0,40);
      const koA=clamp((a.power-b.chin)/42,0,.93)*clamp((offA-offB)/34+0.46,0,1)*0.64*(1-b.fightIQ*0.0022)*(1+a.killer*0.003)*(1-b.heart*0.0016);
      const koB=clamp((b.power-a.chin)/42,0,.93)*clamp((offB-offA)/34+0.46,0,1)*0.64*(1-a.fightIQ*0.0022)*(1+b.killer*0.003)*(1-a.heart*0.0016);
      if(rnd()<koA){finish={by:A,loser:B,method:'KO/TKO',round:r};st.A.kd++;}
      else if(rnd()<koB){finish={by:B,loser:A,method:'KO/TKO',round:r};st.B.kd++;}
      log.push({r,phase:'debout'});
    }
    if(dmgA>45&&rnd()<.4)A.attrs.chin=clamp(A.attrs.chin-1,1);
    if(dmgB>45&&rnd()<.4)B.attrs.chin=clamp(B.attrs.chin-1,1);
  }
  let res;
  if(finish){ res={winner:finish.by===A?'A':'B',method:finish.method,round:finish.round,detail:finish.detail||''}; }
  else { const d=sa-sb; res=(Math.abs(d)<5&&rnd()<.5)?{winner:rnd()<.5?'A':'B',method:'Décision partagée'}:{winner:d>=0?'A':'B',method:'Décision'}; }
  res.scoreA=Math.round(sa); res.scoreB=Math.round(sb); res.log=log; res.stats=st; return res;
}
function applyResult(F,opp,res,side){ const win=res.winner===side; const m=res.method;
  if(win){ F.W++; F.streak=Math.max(1,F.streak+1); if(m.startsWith('KO'))F.ko++; else if(m.startsWith('Soum'))F.sub++; else F.dec++; F.morale=clamp(F.morale+RI(6,12),0,100); }
  else { F.L++; F.streak=Math.min(-1,F.streak-1); if(m.startsWith('KO'))F.koLoss++; F.morale=clamp(F.morale-RI(8,16),0,100); }
  F.form=clamp(F.form+(win?RI(3,8):-RI(5,12)),0,100);
  F.history.push({res:win?'win':'loss',method:m,round:res.round||null,oppId:opp&&opp.id});
  if(F.history.length>60)F.history=F.history.slice(-60);
  return win;
}
/* estimation IMPARFAITE de la proba de victoire (pour l'UI : fourchette) */
function winProbEstimate(A,B){ const a=eff(A),b=eff(B);
  const oa=A.overall+a.killer*0.05+reachEdge(A,B), ob=B.overall+b.killer*0.05;
  let p=sigmoid((oa-ob)/12); p=clamp(p*100+RI(-8,8),3,97)/100; return p; // bruit volontaire
}

/* ------------------------- ORGS / CLASSEMENT / ÂGE ------------------------ */
const ORGS=['Amateur','Circuit local','Circuit régional','Circuit national','Ligue européenne','Élite internationale'];
const ORG_PROMO_OVR=[0,32,42,52,60,68];   // overall requis pour évoluer vers l'org n
function canPromote(f){ const n=f.org+1; return n<ORGS.length && (f.orgWins||0)>=3 && f.overall>=ORG_PROMO_OVR[n]; }
function p4pScore(f){ const fights=f.W+f.L+f.D; if(fights<3)return f.overall*1.3;
  const wr=f.W/fights;
  const base=f.overall*1.8 + wr*120 + f.defenses*14 + (f.champion?26:0) + Math.max(0,f.streak)*2 + Math.min(f.titles,3)*10;
  return base*clamp(0.45+wr*0.6,0.45,1.05) - f.L*5 - f.koLoss*3;
}
function rankPool(list){ return list.slice().sort((x,y)=>p4pScore(y)-p4pScore(x)); }
function applyAging(f){ const A=f.age; if(A>=33){ // déclin
    const dec=k=>f.attrs[k]=clamp(f.attrs[k]-RI(0,2),1,100);
    dec('footSpeed');dec('handSpeed');dec('cardio');dec('explosiveness'); if(A>=36){dec('power');dec('recovery');} f.attrs.chin=clamp(f.attrs.chin-(A>=35?RI(0,2):0),1,100);
  } else if(A>=27){ /* pic : stable */ }
  f.age++; f.overall=overall(f);
}
/* progression BORNÉE : un choix applique un delta net d'attributs ( up/down),
   plafonné par le potentiel — pas d'amélioration infinie. */
function applyDeltas(f,deltas){ const applied=[]; for(const [k,dv] of deltas){
    if(k==='morale'){ f.morale=clamp(f.morale+dv,0,100); applied.push(['Moral',dv]); continue; }
    if(k==='form'){ f.form=clamp(f.form+dv,0,100); applied.push(['Forme',dv]); continue; }
    const before=f.attrs[k]; let after=before+dv;
    if(dv>0) after=Math.min(after, f.potential+4);   // borne haute = potentiel
    f.attrs[k]=clamp(after,1,100); const real=Math.round(f.attrs[k]-before);
    if(real!==0)applied.push([attrLabel(k),real]);
  } f.overall=overall(f); return applied;
}
/* tentative de déblocage d'une compétence (chance selon rareté + affinités) */
function rollSkill(f){ const pool=SKILLS.filter(s=>!f.skills.includes(s.id));
  for(const s of pool){ let ch=RAR_CHANCE[s.rar]||0.03; if(f.drive===s.type)ch*=1.4;
    if(rnd()<ch*0.16){ f.skills.push(s.id); for(const k in s.fx)f.attrs[k]=clamp(f.attrs[k]+s.fx[k],1,100); f.overall=overall(f); return s; } }
  return null;
}
/* épithètes de fin de carrière (uniques, certains liés à la catégorie) */
function epithets(f){ const e=[]; const fights=f.W+f.L+f.D; const wr=f.W/Math.max(1,fights);
  if(f.ko>=12)e.push('Machine à KO'); if(f.sub>=12)e.push('Le chasseur de cou');
  if(f.titles>=1&&f.L===0)e.push('L\u2019Invaincu'); if(f.defenses>=5)e.push('Le monarque');
  if(f.attrs.power>=92&&/plume|paille|mouche|coq/i.test(f.divName))e.push('Le Ngannou des petits gabarits');
  if(f.skills.includes('anaconda'))e.push('L\u2019Anaconda'); if(f.skills.includes('twister'))e.push('Le Tordeur');
  if(f.morale>=85&&f.titles>=1)e.push('Le favori du public'); if(wr>=0.85&&fights>=15)e.push('Le prodige');
  if(f.koLoss>=6)e.push('La guerre l\u2019a marqué'); if(!e.length)e.push('L\u2019artisan de la cage');
  return e;
}

/* --------------------------- roster / classement -------------------------- */
function orgLevel(org){ return [38,46,54,61,67,73][org]||40; }
function makeOrgRoster(f){ const base=orgLevel(f.org); const pool=[];
  for(let i=0;i<12;i++){ const lv=clamp(base+RI(-10,14),20,97);
    const o=makeFighter({gender:f.gender,div:f.div,level:lv,potential:lv+RI(2,12),age:RI(22,35)});
    o.W=RI(6,24); o.L=RI(1,8); o.ko=RI(0,o.W); o.streak=RI(-2,6); pool.push(o); }
  const ranked=rankPool(pool);
  if(f.org>=4){ ranked[0].champion=f.org>=5?'monde':'europe'; ranked[0].defenses=RI(0,4); }
  return ranked;
}
function divRank(f){ return rankPool(G.roster.filter(o=>!o.champion).concat([f])).findIndex(o=>o===f)+1; }
function advanceRoster(){ const r=G.roster.filter(o=>!o.champion);
  for(let n=0;n<3;n++){ const a=pick(r),b=pick(r); if(a===b)continue; const res=simulateFight(a,b,3); applyResult(a,b,res,'A'); applyResult(b,a,res,'B'); }
  G.roster=rankPool(G.roster); }

/* --------------------------- 3 adversaires + % ---------------------------- */
function tacticalRead(f,o){ const a=eff(f),b=eff(o);
  if(b.striking>b.ground+12 && b.striking>a.striking) return 'Redoutable debout — amène-le au sol.';
  if(b.takedown>a.tdd+10) return 'Gros lutteur — garde la cage dans le dos, sprawle.';
  if(b.submission>a.guard+12) return 'Dangereux au sol — reste debout, méfie-toi du cou.';
  if(a.overall> o.overall+8) return 'Sur le papier, tu domines. Ne te relâche pas.';
  if(o.overall> f.overall+8) return 'Plus fort que toi. Il te faudra un plan.';
  return 'Combat équilibré — l\u2019intelligence fera la différence.';
}
function genOpponents(f){ const base=orgLevel(f.org); const tiers=[-8,2,12]; // faible / similaire / coriace (non dit)
  return tiers.map(dl=>{ const lv=clamp(base+f.streak*0.4+dl+RI(-4,4),20,97);
    const o=makeFighter({gender:f.gender,div:f.div,level:lv,potential:lv+RI(2,12),age:RI(21,35)});
    o.W=RI(4,22); o.L=RI(0,9); o.ko=RI(0,o.W); o.sub=RI(0,Math.max(0,o.W-o.ko)); o.streak=RI(-2,7);
    const p=winProbEstimate(f,o);
    return {o, wp:Math.round(p*100), read:tacticalRead(f,o)}; });
}

function trainingOptions(f){ const gen=TRAIN.filter(x=>x.t.includes('all'));
  const spec=TRAIN.filter(x=>x.t.includes(f.style));
  const opts=[]; const s=spec.slice(); const g=gen.slice();
  // 2 liées au sport + 1 générale (mélangées)
  for(let i=0;i<2&&s.length;i++) opts.push(s.splice(Math.floor(rnd()*s.length),1)[0]);
  if(g.length) opts.push(g.splice(Math.floor(rnd()*g.length),1)[0]);
  while(opts.length<3 && g.length) opts.push(g.splice(Math.floor(rnd()*g.length),1)[0]);
  return opts.sort(()=>rnd()-0.5);
}

function startFightSelect(){ G.opps=genOpponents(G.f); G.screen='select'; save(); render(); }
function chooseOpponent(i){ G.sel=G.opps[i]; G.train=trainingOptions(G.f); G.screen='camp'; save(); render(); }
function chooseTraining(i){ const opt=G.train[i]; const applied=applyDeltas(G.f,opt.d); G.campApplied={label:opt.label,deltas:applied};
  const kind=fightKind(); const opp=G.sel.o; const rounds=(kind==='title')?5:3;
  G.fight={kind,opp,rounds,wp:G.sel.wp}; resolveFight(); buildTimeline(); G.screen='arena'; save(); render(); }
function fightKind(){ const f=G.f; if(f.champion) return 'defense'; if(f.org>=4 && ((f.orgWins||0)>=3 || divRank(f)<=2)) return 'title'; return 'normal'; }

function resolveFight(){ const {opp,rounds,kind}=G.fight;
  const res=simulateFight(G.f,opp,rounds); const win=applyResult(G.f,opp,res,'A'); applyResult(opp,G.f,res,'B');
  G.f.orgWins=win?((G.f.orgWins||0)+1):Math.max(0,(G.f.orgWins||0)-1);
  const finish=!res.method.startsWith('Déc'); let milestone='';
  // titre
  if(win && kind==='title'){ G.f.champion=(G.f.org>=5?'monde':'europe'); G.f.titles++; G.roster.forEach(o=>o.champion=null); milestone=(G.f.org>=5?'🏆 CEINTURE MONDIALE':'🥈 CEINTURE EUROPÉENNE'); }
  else if(win && kind==='defense'){ G.f.defenses++; milestone='Titre défendu ('+G.f.defenses+')'; }
  else if(!win && G.f.champion){ G.f.champion=null; milestone='Titre perdu'; }
  // compétence débloquée ?
  const skill=rollSkill(G.f);
  // vieillissement (1 an ~ 2-4 combats)
  G.f._fy=(G.f._fy||0)+1; if(G.f._fy>=RI(2,4)){ applyAging(G.f); G.f._fy=0; }
  let forced=false; if(G.f.age>=42 || (G.f.age>=38 && G.f.overall<48)){ G.f.retired=true; forced=true; }
  // promotion d'organisation (progression graduelle) — remet le roster à neuf
  if(canPromote(G.f)){ G.f.org++; G.f.orgWins=0; if(G.f.stage==='amateur' && G.f.org>=1){ turnPro(); } G.f.champion=null; G.roster=makeOrgRoster(G.f); milestone=milestone||('Promotion : '+ORGS[G.f.org]); }
  advanceRoster();
  const newAch=checkAch();
  G.pending={res,win,method:res.method,finish,milestone,skill,newAch,forced,
    opp:{name:opp.name,flag:opp.flag}, camp:G.campApplied};
}
function turnPro(){ const f=G.f; f.amaRec={W:f.W,L:f.L}; f.stage='pro';
  f.W=f.L=f.D=f.ko=f.sub=f.dec=f.koLoss=f.streak=0; f.history=[]; f.champion=null; f.titles=0; f.defenses=0; f._fy=0;
  f.nick=earnNickname(f); }
function earnNickname(f){ const a=f.attrs;
  const striker=['le Sniper','le Marteau','la Foudre','le Bourreau','Mains de Pierre','le Cogneur','la Guillotine debout'];
  const grappler=['l\u2019Anaconda','le Python','le Boa','l\u2019Étau','le Sorcier du sol','le Suffocateur'];
  const pressure=['le Bulldozer','le Rouleau','Cœur de Lion','la Machine','l\u2019Ouragan'];
  const tech=['le Chirurgien','le Professeur','le Métronome','l\u2019Horloger','l\u2019Architecte'];
  const amaKO=f.amaRec, koRate=(f.amaRec&&(f.W))?0:0;
  // choisi selon les points forts
  if(a.submission>=a.power && a.submission>=a.jab) return pick(grappler);
  if(a.power>=70 || a.killer>=70) return pick(striker);
  if(a.fightIQ>=70 || a.adaptability>=70) return pick(tech);
  if(a.heart>=70 || a.cardio>=70) return pick(pressure);
  return pick(striker.concat(tech));
}

function legacyTitle(f){ const s=(f._world?300:0)+(f._euro?120:0)+f.defenses*30+f.W*3-f.L*4+f.ko*2+f.sub*2;

  if(s>=140)return['⭐','CHAMPION RESPECTÉ']; if(s>=60)return['🥊','COMBATTANT ACCOMPLI'];
  if(s>=10)return['🎖️','VÉTÉRAN DU CIRCUIT']; return['🔨','GUERRIER DE L\u2019OMBRE']; }
function scr_legacy(){ const f=G.f; const [ico,rank]=legacyTitle(f); const ep=epithets(f);
  return `<div class="scr center"><div class="eyebrow">Palmarès scellé</div>

     <div class="hr"></div>

       <div><span class="lg-v gold">${f.ko}/${f.sub}</span><span class="lg-l">KO/SUB</span></div>
       <div><span class="lg-v gold">${f.defenses}</span><span class="lg-l">Défenses</span></div>
       <div><span class="lg-v gold">${f.skills.length}</span><span class="lg-l">Compét.</span></div></div>
     <div class="muted small mt">${f.motivation}</div></div>
   <button class="btn primary" onclick="CL.newCareer()">Nouvelle carrière</button></div>`; }

const SCREENS={intro:scr_intro,create:scr_create,hub:scr_hub,select:scr_select,camp:scr_camp,arena:scr_arena,
  result:scr_result,profile:scr_profile,rankings:scr_rankings,ach:scr_ach,retire:scr_retire,legacy:scr_legacy,hof:scr_hof};

/* ============================== RENDER + CL =============================== */
function render(){ const app=document.getElementById('app'); if(!app)return;
  const fn=SCREENS[G&&G.screen]||scr_intro; app.innerHTML=fn(); if(G&&G.screen==='arena') startArena(); window.scrollTo&&window.scrollTo(0,0); }
const CL={
  theme(){ setTheme(G.theme==='light'?'dark':'light'); save(); render(); },
  go(s){ if(!G)G={theme:'dark'}; G.screen=s; render(); },
  cont(){ if(load()){ setTheme(G.theme||'dark'); G.screen='hub'; render(); } },
  draft(k,v){ G.draft[k]=v; if(k==='gender')G.draft.div=DIVISIONS[v][Math.min(3,DIVISIONS[v].length-1)].id; render(); },
  draftIn(k,v){ G.draft[k]=v; },
  create(){ const d=G.draft; const f=makeFighter({gender:d.gender,div:d.div,style:d.style,countryKey:d.country,first:(d.first||'').trim()||undefined,age:RI(16,19),potential:RI(70,94)});
    f.stage='amateur'; f.org=0; f._fy=0; G.f=f; G.roster=makeOrgRoster(f); G.ach=[]; checkAch(); G.screen='hub'; save(); render(); },
  fightSelect(){ startFightSelect(); },
  opp(i){ chooseOpponent(i); },
  train(i){ chooseTraining(i); },
  skipArena(){ CL.toResult(); },
  toResult(){ stopArena(); G.screen='result'; save(); render(); },
  afterResult(){ G.screen='hub'; save(); render(); },
  toLegacy(){ G.f.retired=true; enshrine(G.f); G.screen='legacy'; save(); render(); },
  newCareer(){ wipe(); const t=G.theme; G={theme:t,draft:{gender:'H',style:'boxer',country:COUNTRY_KEYS[0],div:DIVISIONS.H[3].id,first:''}}; setTheme(t); CL.go('create'); },
  exportSave(){ try{ const blob=JSON.stringify(G); const ta=document.createElement('textarea'); ta.value=blob; ta.style.position='fixed'; ta.style.opacity='0'; document.body.appendChild(ta); ta.select();
      try{ document.execCommand('copy'); alert('Sauvegarde copiée — colle-la dans un fichier texte pour la garder.'); }catch(e){ prompt('Copie ce texte :',blob); }
      document.body.removeChild(ta); }catch(e){ alert('Export impossible.'); } },
  importSave(){ const s=prompt('Colle ta sauvegarde ici :'); if(!s)return; try{ G=migrate(JSON.parse(s)); setTheme(G.theme||'dark'); G.screen='hub'; save(); render(); }catch(e){ alert('Sauvegarde invalide ou corrompue.'); } },
};
window.CL=CL;
if(document.getElementById('app')){ G={screen:'intro',theme:'dark',draft:{gender:'H',style:'boxer',country:COUNTRY_KEYS[0],div:DIVISIONS.H[3].id,first:''}}; setTheme('dark'); render(); }


/* ============================ ARÈNE 2D ==================================== */
/* Rejoue le combat round par round à partir de res.log, en cohérence stricte
   avec le résultat du moteur (même vainqueur, méthode, round). Silhouettes
   dans la DA archive : oxblood = joueur (gauche), sage = adversaire (droite). */
let ARENA=null;
function buildTimeline(){
  const res=G.pending.res, you=G.f, opp=G.fight.opp, meWin=G.pending.win;
  const log=(res.log&&res.log.length)?res.log:[{r:1,phase:'debout'}];
  const beats=[];
  const em=eff(you), eo=eff(opp);
  const offMe=em.striking+em.power+em.handSpeed;
  const offOp=eo.striking+eo.power+eo.handSpeed;
  for(let ri=0;ri<log.length;ri++){ const L=log[ri], last=(ri===log.length-1);
    const phase=L.phase, topIsMe=L.top?(L.top==='A'):null;
    const n=phase==='sol'?4:5;
    for(let k=0;k<n;k++){ let by;
      if(phase==='sol') by=topIsMe?'me':'op';
      else by=(Math.random()<offMe/(offMe+offOp))?'me':'op';
      beats.push({phase,by,round:L.r,finish:false}); }
    if(last && (res.method.startsWith('KO')||res.method.startsWith('Soum')))
      beats.push({phase,by:meWin?'me':'op',round:L.r,finish:true,method:res.method});
  }
  if(res.method.startsWith('Déc')) beats.push({phase:'bell',finish:true,method:res.method,round:log[log.length-1].r});
  // santé finale cohérente
  let hMeEnd=60,hOpEnd=60;
  if(res.method.startsWith('Déc')){ const s=res.scoreA+res.scoreB||1; hMeEnd=clamp(20+70*res.scoreA/s,12,92); hOpEnd=clamp(20+70*res.scoreB/s,12,92); }
  else { if(meWin){hOpEnd=res.method.startsWith('KO')?4:22; hMeEnd=clamp(45+RI(0,25));} else {hMeEnd=res.method.startsWith('KO')?4:22; hOpEnd=clamp(45+RI(0,25));} }
  ARENA={beats,idx:-1,started:false,done:false,raf:0,to:0,t0:0,lastBeat:-1,
    hMe:100,hOp:100,stMe:100,stOp:100,hMeEnd,hOpEnd,
    flashMe:0,flashOp:0,shakeMe:0,shakeOp:0,lungeMe:0,lungeOp:0,fall:0,tap:0,method:res.method,meWin,
    nmeName:you.first,nopName:opp.first,meFlag:you.flag,opFlag:opp.flag};
}
const BEAT_MS=440;
function startArena(){ if(!ARENA||ARENA.started)return; ARENA.started=true;
  const cv=document.getElementById('arena-cv');
  if(!cv||!cv.getContext||typeof requestAnimationFrame==='undefined'){ ARENA.done=true; return; } // pas de canvas (test)
  const dpr=Math.min(window.devicePixelRatio||1,2); const W=cv.clientWidth||360, H=220;
  cv.width=W*dpr; cv.height=H*dpr; const ctx=cv.getContext('2d'); ctx.scale(dpr,dpr);
  ARENA.W=W; ARENA.H=H; ARENA.ctx=ctx; ARENA.t0=performance.now();
  const total=ARENA.beats.length*BEAT_MS;
  const loop=(now)=>{ const el=now-ARENA.t0; const bi=Math.min(ARENA.beats.length-1,Math.floor(el/BEAT_MS));
    if(bi!==ARENA.lastBeat){ ARENA.lastBeat=bi; applyBeat(ARENA.beats[bi]); }
    drawArena((el%BEAT_MS)/BEAT_MS); paintBars();
    if(el>=total){ ARENA.done=true; drawArena(1,true); ARENA.to=setTimeout(()=>CL.toResult(),1300); return; }
    ARENA.raf=requestAnimationFrame(loop); };
  paintBars(); ARENA.raf=requestAnimationFrame(loop);
}
function applyBeat(b){ const A=ARENA; if(!b)return;
  if(b.phase==='bell')return;
  const dmg = b.phase==='sol'? RI(4,9) : RI(6,13);
  if(b.by==='me'){ A.hOp=clamp(A.hOp-dmg,A.hOpEnd*0.6,100); A.flashOp=1; A.shakeOp=1; A.lungeMe=1; }
  else { A.hMe=clamp(A.hMe-dmg,A.hMeEnd*0.6,100); A.flashMe=1; A.shakeMe=1; A.lungeOp=1; }
  A.stMe=clamp(A.stMe-RI(2,5),12,100); A.stOp=clamp(A.stOp-RI(2,5),12,100);
  if(b.finish){ if(b.method.startsWith('KO')){ if(A.meWin){A.hOp=2;A.fall=2;} else {A.hMe=2;A.fall=1;} }
    else if(b.method.startsWith('Soum')){ A.tap=A.meWin?2:1; } }
  A.curPhase=b.phase; A.curTop=(b.phase==='sol')?(b.by==='me'?'me':'op'):null;
}
function fighter(ctx,x,groundY,face,color,o){ // o: {lunge,flash,shake,fallen,grounded,top,tap}
  ctx.save();
  const sh=o.shake?( (Math.random()-0.5)*4 ):0;
  x+=face*(o.lunge*14)+sh;
  const bob=Math.sin(performance.now()/240 + (face>0?0:1))*2;
  if(o.grounded && !o.top){ // au sol sur le dos
    ctx.translate(x,groundY-8); ctx.fillStyle=o.flash?'#fff':color; ctx.globalAlpha=.95;
    ctx.beginPath(); ctx.ellipse(0,0,34,11,0,0,7); ctx.fill(); // corps allongé
    ctx.beginPath(); ctx.arc(-face*30,-4,8,0,7); ctx.fill(); ctx.restore(); return;
  }
  let topLean=o.grounded&&o.top?18:0;
  ctx.translate(x, groundY-52+bob+ (o.fallen?46:0));
  if(o.fallen){ ctx.rotate(face*1.3); }
  else if(topLean){ ctx.rotate(-face*0.5); ctx.translate(0,34); }
  const col=o.flash?'#fff':color;
  // jambes
  ctx.strokeStyle=col; ctx.lineWidth=6; ctx.lineCap='round';
  ctx.beginPath(); ctx.moveTo(-3,4); ctx.lineTo(-10,46); ctx.moveTo(4,4); ctx.lineTo(12,46); ctx.stroke();
  // torse
  ctx.lineWidth=15; ctx.beginPath(); ctx.moveTo(0,-6); ctx.lineTo(0,26); ctx.stroke();
  // tête
  ctx.fillStyle=col; ctx.beginPath(); ctx.arc(0,-20,9,0,7); ctx.fill();
  // bras : garde haute, ou coup tendu si lunge
  ctx.lineWidth=6;
  const reach=o.lunge; 
  ctx.beginPath(); // bras arrière (garde)
  ctx.moveTo(0,2); ctx.lineTo(-face*8,-10); ctx.stroke();
  ctx.beginPath(); // bras avant (frappe)
  ctx.moveTo(0,0); ctx.lineTo(face*(10+reach*20), -8+reach*4); ctx.stroke();
  ctx.fillStyle=o.flash?'#fff':color; ctx.beginPath(); ctx.arc(face*(10+reach*20),-8+reach*4,4.5,0,7); ctx.fill(); // gant
  ctx.restore();
}
function drawArena(frac,freeze){ const A=ARENA, ctx=A.ctx; if(!ctx)return; const W=A.W,H=A.H;
  ctx.clearRect(0,0,W,H);
  // décor : sol de cage
  const gY=H-24;
  const g=ctx.createLinearGradient(0,0,0,H); g.addColorStop(0,'#1c1710'); g.addColorStop(1,'#241d14');
  ctx.fillStyle=g; ctx.fillRect(0,0,W,H);
  ctx.strokeStyle='#3a2f20'; ctx.lineWidth=1;
  for(let i=0;i<=8;i++){ const x=i*W/8; ctx.globalAlpha=.5; ctx.beginPath(); ctx.moveTo(x,gY); ctx.lineTo(x*0.6+W*0.2,H*0.34); ctx.stroke(); }
  ctx.globalAlpha=1; ctx.strokeStyle='#4a3c1f'; ctx.beginPath(); ctx.moveTo(0,gY); ctx.lineTo(W,gY); ctx.stroke();
  const grounded=A.curPhase==='sol';
  // adversaire (droite, sage, face gauche)
  fighter(ctx, W*0.66, gY, -1, '#6E8478', {lunge:A.lungeOp*(1-frac),flash:A.flashOp>0,shake:A.shakeOp>0,fallen:A.fall===2,grounded,top:A.curTop==='op'});
  // joueur (gauche, oxblood, face droite)
  fighter(ctx, W*0.34, gY, 1, '#B23B36', {lunge:A.lungeMe*(1-frac),flash:A.flashMe>0,shake:A.shakeMe>0,fallen:A.fall===1,grounded,top:A.curTop==='me'});
  // décrément des effets
  A.flashMe=Math.max(0,A.flashMe-0.5); A.flashOp=Math.max(0,A.flashOp-0.5);
  A.shakeMe=Math.max(0,A.shakeMe-0.5); A.shakeOp=Math.max(0,A.shakeOp-0.5);
  A.lungeMe*=0.86; A.lungeOp*=0.86;
  // étiquette de phase / finition
  ctx.font="600 11px 'JetBrains Mono',monospace"; ctx.textAlign='center'; ctx.fillStyle='#9A8F7C';
  const rnd=A.beats[A.lastBeat]?A.beats[A.lastBeat].round:1;
  let label = grounded?'SOL':'DEBOUT';
  if(A.done){ label = A.method.startsWith('Déc')?'AUX POINTS': (A.method.startsWith('KO')?'KO / TKO':'SOUMISSION'); ctx.fillStyle='#C6A15B'; ctx.font="700 14px 'Oswald'"; }
  ctx.fillText(A.done?label:('ROUND '+rnd+' · '+label), W/2, 20);
  // tap (soumission)
  if(A.tap){ ctx.fillStyle='#C6A15B'; ctx.font="700 13px 'Oswald'"; ctx.fillText('TAP !', A.tap===1?W*0.34:W*0.66, gY-70); }
}
function stopArena(){ if(ARENA){ if(ARENA.raf&&typeof cancelAnimationFrame!=='undefined')cancelAnimationFrame(ARENA.raf); if(ARENA.to)clearTimeout(ARENA.to); } }
function scr_arena(){ const A=ARENA||{};
  return `<div class="fade"><div class="eyebrow center">${esc(A.nmeName||'')} ${A.meFlag||''} vs ${A.opFlag||''} ${esc(A.nopName||'')}</div>
   <div class="card raise" style="padding:10px">
     <div class="arena-hud"><span class="ah-name blood">${esc(A.nmeName||'Toi')}</span><span class="ah-name sage" style="text-align:right">${esc(A.nopName||'Adv.')}</span></div>
     <div class="arena-bars"><div class="ab"><div class="ab-fill me" id="ab-me"></div></div><div class="ab"><div class="ab-fill op" id="ab-op"></div></div></div>
     <canvas id="arena-cv" style="width:100%;height:220px;display:block;border-radius:4px;margin-top:8px"></canvas>
     <div class="arena-st"><div class="st-lbl">Cardio</div><div class="st-lbl" style="text-align:right">Cardio</div></div>
     <div class="arena-bars sm"><div class="ab"><div class="ab-fill st" id="st-me"></div></div><div class="ab"><div class="ab-fill st" id="st-op"></div></div></div>
   </div>
   <button class="btn ghost" onclick="CL.skipArena()">Passer l\u2019animation ▸</button></div>`; }
/* mise à jour des barres HTML à chaque frame */
function paintBars(){ if(!ARENA)return; const set=(id,v)=>{const e=document.getElementById(id); if(e)e.style.width=clamp(v,0,100)+'%';};
  set('ab-me',ARENA.hMe); set('ab-op',ARENA.hOp); set('st-me',ARENA.stMe); set('st-op',ARENA.stOp); }

})();
</script></body></html>
